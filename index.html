<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Generated | NIPEX LAG</title>
    <style>
        :root { --bg: #000000; --card: #121212; --text: #ffffff; --accent: #00ff88; --error: #ff4444; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        .container { 
            width: 100%; 
            max-width: 400px; 
            text-align: center;
            margin-top: 50px;
        }

        .key-icon { 
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: -45px auto 15px; 
            border: 2px solid #00ff88;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.15);
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .key-icon:hover {
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.25);
            transform: scale(1.05);
        }

        /* Logo Image Style */
        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Fallback text if image fails to load */
        .logo-text {
            display: none;
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            letter-spacing: 2px;
            line-height: 1.2;
            text-align: center;
        }

        .logo-text span {
            display: block;
            font-size: 12px;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 4px;
            opacity: 0.6;
            margin-top: 2px;
        }

        @media (min-width: 768px) {
            .container { max-width: 450px; }
            .key-icon { width: 150px; height: 150px; margin: -55px auto 20px; }
            .logo-img { width: 150px; height: 150px; }
        }

        h1 { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }

        .card { 
            background: var(--card); 
            border: 1px solid #222; 
            border-radius: 28px; 
            padding: 40px 30px 30px; 
            text-align: center; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.6); 
            position: relative;
        }

        h2 { font-size: 22px; margin-bottom: 12px; color: var(--accent); font-weight: 700; }
        .card-p { color: #999; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }

        .key-box { 
            background: #000; 
            padding: 22px; 
            border-radius: 18px; 
            border: 1px dashed var(--accent); 
            margin-bottom: 25px; 
            position: relative; 
            overflow: hidden; 
        }
        
        #finalKey { 
            color: var(--accent); 
            font-family: 'Courier New', monospace; 
            font-size: 19px; 
            font-weight: bold; 
            letter-spacing: 1px; 
        }
        
        .btn { 
            width: 100%; 
            padding: 18px; 
            background: #ffffff; 
            color: #000; 
            border: none; 
            border-radius: 16px; 
            font-size: 16px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .btn:hover { 
            transform: scale(1.03); 
            background: var(--accent); 
            box-shadow: 0 10px 20px rgba(0,255,136,0.2);
        }

        .btn-secondary {
            background: #333;
            color: #fff;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: #555;
        }

        /* 🔴 HIDDEN BUTTON - Jab tak expire na ho */
        .btn-hidden {
            display: none !important;
        }

        .btn-visible {
            display: block !important;
        }

        .timer-box {
            margin-top: 15px;
            padding: 12px;
            background: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #00ff8844;
        }

        .timer-label {
            color: #888;
            font-size: 12px;
        }

        #timerDisplay {
            color: #00ff88;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .expiry-status {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }

        .footer { 
            margin-top: 80px; 
            color: #333; 
            font-size: 10px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: bold; 
        }

        /* Expired state styles */
        .expired .timer-box {
            border-color: #ff4444;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="mainContainer">
        <div class="key-icon">
            <!-- ✅ Logo Image from GitHub -->
            <img 
                src="https://raw.githubusercontent.com/mahatnipen-alt/nipex--get-key/main/assets/logo.png" 
                alt="NIPEX LAG Logo" 
                class="logo-img"
                onerror="this.style.display='none'; document.querySelector('.logo-text').style.display='block';"
            >
            <!-- Fallback text if image doesn't load -->
            <div class="logo-text">
                NIPEX
                <span>LAG</span>
            </div>
        </div>

        <h1>Access Unlocked</h1>
        <p class="subtitle">Your device-locked license key is ready.</p>

        <div class="card">
            <h2>Generation Success!</h2>
            <p class="card-p">This key is locked to your device. Share it, and it won't work for others.</p>

            <div class="key-box">
                <span id="finalKey">SECURE FETCHING...</span>
            </div>

            <!-- TIMER DISPLAY -->
            <div class="timer-box">
                <div class="timer-label">⏳ Key Valid For</div>
                <div id="timerDisplay">24:00:00</div>
            </div>

            <div class="expiry-status" id="expiryStatus">✅ Key is active</div>

            <button class="btn" id="copyBtn" onclick="copyKey()">
                COPY TO CLIPBOARD
            </button>

            <!-- 🔴 GENERATE NEW KEY BUTTON - Initially HIDDEN -->
            <button class="btn btn-secondary btn-hidden" id="refreshBtn" onclick="refreshKey()">
                🔄 GENERATE NEW KEY
            </button>
        </div>
    </div>

    <div class="footer">NIPEX LAG SECURITY SYSTEM</div>
</div>

<script>
    let keyExpiryTime = null;
    let countdownInterval = null;

    async function generateLockedKey() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            const ip = data.ip;

            // Check Local Storage
            const savedExpiry = localStorage.getItem('keyExpiryTime');
            const savedKey = localStorage.getItem('generatedKey');
            const savedIp = localStorage.getItem('deviceIp');

            // Agar same device hai aur timer save hai toh use karo
            if (savedExpiry && savedKey && savedIp === ip) {
                const expiryTime = parseInt(savedExpiry);
                const now = Date.now();

                if (expiryTime > now) {
                    // Timer active hai
                    keyExpiryTime = expiryTime;
                    document.getElementById('finalKey').innerText = savedKey;
                    document.getElementById('finalKey').style.color = "#00ff88";
                    document.getElementById('expiryStatus').innerText = "KEY IS ACTIVE";
                    document.getElementById('expiryStatus').style.color = "#00ff88";
                    
                    // 🔴 Refresh button HIDE karo (kyunki key active hai)
                    document.getElementById('refreshBtn').classList.remove('btn-visible');
                    document.getElementById('refreshBtn').classList.add('btn-hidden');
                    
                    startCountdown();
                    return;
                } else {
                    // Timer expire ho chuka hai
                    showExpiredState();
                    return;
                }
            }

            // 🔴 NEW KEY GENERATE (Pehli baar)
            const hour = Math.floor(Date.now() / 3600000);
            const dayHour = Math.floor(hour / 24);
            
            const ipSeed = parseInt(ip.replace(/\./g, '').substring(0, 6)); 
            let seed = ipSeed + dayHour + 2026; 
            
            function rnd() { 
                var x = Math.sin(seed++) * 10000; 
                return Math.abs(x - Math.floor(x)); 
            }
            
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let segments = [];
            for(let i=0; i<4; i++) {
                let s = "";
                for(let j=0; j<4; j++) {
                    let r = Math.floor(rnd() * chars.length);
                    s += chars.charAt(r);
                }
                segments.push(s);
            }

            const finalKey = "NIPEX-" + segments.join("-");
            document.getElementById('finalKey').innerText = finalKey;
            document.getElementById('finalKey').style.color = "#00ff88";
            
            // Save to Local Storage
            keyExpiryTime = Date.now() + (24 * 60 * 60 * 1000);
            localStorage.setItem('keyExpiryTime', keyExpiryTime.toString());
            localStorage.setItem('generatedKey', finalKey);
            localStorage.setItem('deviceIp', ip);
            
            document.getElementById('expiryStatus').innerText = " KEY IS ACTIVE";
            document.getElementById('expiryStatus').style.color = "#00ff88";
            
            // 🔴 Refresh button HIDE karo (key active hai)
            document.getElementById('refreshBtn').classList.remove('btn-visible');
            document.getElementById('refreshBtn').classList.add('btn-hidden');
            
            startCountdown();

        } catch (err) {
            document.getElementById('finalKey').innerText = "CONNECT TO INTERNET";
        }
    }

    function startCountdown() {
        if (countdownInterval) clearInterval(countdownInterval);
        
        countdownInterval = setInterval(() => {
            const now = Date.now();
            const timeLeft = keyExpiryTime - now;

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                showExpiredState();
                return;
            }

            const hours = Math.floor(timeLeft / 3600000);
            const minutes = Math.floor((timeLeft % 3600000) / 60000);
            const seconds = Math.floor((timeLeft % 60000) / 1000);

            const timerString = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById('timerDisplay').innerText = timerString;
        }, 1000);
    }

    // 🔴 EXPIRED STATE - Show Refresh Button
    function showExpiredState() {
        document.getElementById('finalKey').innerText = "⛔ KEY EXPIRED";
        document.getElementById('finalKey').style.color = "#ff4444";
        document.getElementById('timerDisplay').innerText = "00:00:00";
        document.getElementById('expiryStatus').innerText = "❌ Key expired! Generate new key.";
        document.getElementById('expiryStatus').style.color = "#ff4444";
        document.getElementById('timerDisplay').style.color = "#ff4444";
        
        // 🔴🔴🔴 REFRESH BUTTON SHOW KARO (24 hours complete) 🔴🔴🔴
        document.getElementById('refreshBtn').classList.remove('btn-hidden');
        document.getElementById('refreshBtn').classList.add('btn-visible');
        
        // Local storage clear karo
        localStorage.removeItem('keyExpiryTime');
        localStorage.removeItem('generatedKey');
    }

    function copyKey() {
        const keyText = document.getElementById('finalKey').innerText;
        if(keyText.includes("SECURE") || keyText.includes("CONNECT") || keyText.includes("EXPIRED")) {
            return;
        }

        navigator.clipboard.writeText(keyText).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "COPIED SUCCESSFULLY! ✅";
            btn.style.background = "#00ff88";
            setTimeout(() => { 
                btn.innerText = "COPY TO CLIPBOARD"; 
                btn.style.background = "#ffffff";
            }, 2000);
        });
    }

    // 🔴 REFRESH FUNCTION - Naya key generate
    function refreshKey() {
        if (countdownInterval) clearInterval(countdownInterval);
        
        // Local storage clear karo
        localStorage.removeItem('keyExpiryTime');
        localStorage.removeItem('generatedKey');
        localStorage.removeItem('deviceIp');
        
        document.getElementById('timerDisplay').style.color = "#00ff88";
        document.getElementById('expiryStatus').style.color = "#00ff88";
        
        // 🔴 Refresh button HIDE karo (naya key generate hoga)
        document.getElementById('refreshBtn').classList.remove('btn-visible');
        document.getElementById('refreshBtn').classList.add('btn-hidden');
        
        generateLockedKey();
    }

    window.onload = generateLockedKey;
</script>
</body>
</html>
