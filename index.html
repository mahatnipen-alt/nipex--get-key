<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Generated | NIPEX LAG</title>
    <style>
        :root { --bg: #000000; --card: #121212; --text: #ffffff; --accent: #00ff88; --error: #ff4444; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        .container { 
            width: 100%; 
            max-width: 400px; 
            text-align: center;
            margin-top: 50px;
        }

        /* --- TEXT LOGO STYLES --- */
        .key-icon { 
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: -45px auto 15px; 
            border: 2px solid #00ff88;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.15);
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .key-icon:hover {
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.25);
            transform: scale(1.05);
        }

        .logo-text {
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            letter-spacing: 2px;
            line-height: 1.2;
            text-align: center;
        }

        .logo-text span {
            display: block;
            font-size: 12px;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 4px;
            opacity: 0.6;
            margin-top: 2px;
        }

        @media (min-width: 768px) {
            .container { max-width: 450px; }
            .key-icon { width: 150px; height: 150px; margin: -55px auto 20px; }
            .logo-text { font-size: 28px; }
            .logo-text span { font-size: 14px; }
        }

        h1 { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }

        .card { 
            background: var(--card); 
            border: 1px solid #222; 
            border-radius: 28px; 
            padding: 40px 30px 30px; 
            text-align: center; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.6); 
            position: relative;
        }

        h2 { font-size: 22px; margin-bottom: 12px; font-weight: 700; }
        .card-p { color: #999; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }

        .key-box { 
            background: #000; 
            padding: 22px; 
            border-radius: 18px; 
            border: 1px dashed var(--accent); 
            margin-bottom: 25px; 
            position: relative; 
            overflow: hidden; 
        }
        
        #finalKey { 
            color: var(--accent); 
            font-family: 'Courier New', monospace; 
            font-size: 19px; 
            font-weight: bold; 
            letter-spacing: 1px; 
        }
        
        .btn { 
            width: 100%; 
            padding: 18px; 
            background: #ffffff; 
            color: #000; 
            border: none; 
            border-radius: 16px; 
            font-size: 16px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .btn:hover { 
            transform: scale(1.03); 
            background: var(--accent); 
            box-shadow: 0 10px 20px rgba(0,255,136,0.2);
        }

        .footer { 
            margin-top: 80px; 
            color: #333; 
            font-size: 10px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: bold; 
        }

        /* Error State Styles */
        .error-title { color: var(--error); }
        .error-icon { 
            font-size: 48px; 
            margin-bottom: 10px; 
            display: block; 
        }
        .error-box { 
            border-color: var(--error) !important; 
        }
        .error-box #finalKey { 
            color: var(--error); 
        }
    </style>
</head>
<body>

<div class="container">
    <div id="mainContainer">
        <div class="key-icon">
            <div class="logo-text">
                NIPEX
                <span>LAG</span>
            </div>
        </div>

        <!-- Dynamic Content will be injected here -->
        <div id="dynamicContent"></div>
    </div>

    <div class="footer">NIPEX LAG SECURITY SYSTEM</div>
</div>

<script>
    (function() {
        // --- SOURCE VERIFICATION LOGIC ---
        const urlParams = new URLSearchParams(window.location.search);
        const source = urlParams.get('source');
        const isValidSource = (source === 'official');

        // Get the container where we'll render content
        const contentContainer = document.getElementById('dynamicContent');

        // --- RENDER FUNCTION ---
        function renderContent(isValid) {
            if (isValid) {
                // --- OFFICIAL SOURCE: Show Key Generation UI ---
                contentContainer.innerHTML = `
                    <h1>Access Unlocked</h1>
                    <p class="subtitle">Your device-locked license key is ready.</p>

                    <div class="card">
                        <h2 style="color: var(--accent);">Generation Success!</h2>
                        <p class="card-p">This key is locked to your device. Share it, and it won't work for others.</p>

                        <div class="key-box">
                            <span id="finalKey">SECURE FETCHING...</span>
                        </div>

                        <button class="btn" id="copyBtn" onclick="copyKey()">
                            COPY TO CLIPBOARD
                        </button>
                    </div>
                `;
                // Generate the key after rendering
                generateLockedKey();

            } else {
                // --- UNAUTHORIZED SOURCE: Show Bypass Error ---
                contentContainer.innerHTML = `
                    <h1 style="color: var(--error);">Access Denied</h1>
                    <p class="subtitle" style="color: #ff6666;">Unauthorized request detected.</p>

                    <div class="card">
                        <span class="error-icon">🚫</span>
                        <h2 class="error-title">Bypass Detected!</h2>
                        <p class="card-p">Direct access is prohibited. Please use the official link from the script to generate your key.</p>

                        <div class="key-box error-box">
                            <span id="finalKey">ACCESS BLOCKED</span>
                        </div>

                        <button class="btn" style="background: #333; color: #666; cursor: not-allowed;" disabled>
                            ACCESS DENIED
                        </button>
                    </div>
                `;
            }
        }

        // --- KEY GENERATION FUNCTION (Same as before) ---
        async function generateLockedKey() {
            const keyElement = document.getElementById('finalKey');
            if (!keyElement) return;

            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const ip = data.ip;

                const day = Math.floor(Date.now() / 86400000);
                const ipSeed = parseInt(ip.replace(/\./g, '').substring(0, 6)); 
                
                let seed = ipSeed + day + 2026; 
                
                function rnd() { 
                    var x = Math.sin(seed++) * 10000; 
                    return Math.abs(x - Math.floor(x)); 
                }
                
                const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
                let segments = [];
                for(let i=0; i<4; i++) {
                    let s = "";
                    for(let j=0; j<4; j++) {
                        let r = Math.floor(rnd() * chars.length);
                        s += chars.charAt(r);
                    }
                    segments.push(s);
                }

                const finalKey = "NIPEX-" + segments.join("-");
                keyElement.innerText = finalKey;

            } catch (err) {
                keyElement.innerText = "CONNECT TO INTERNET";
            }
        }

        // --- COPY FUNCTION (Global for button onclick) ---
        window.copyKey = function() {
            const keyText = document.getElementById('finalKey')?.innerText;
            if (!keyText || keyText.includes("SECURE") || keyText.includes("CONNECT") || keyText.includes("BLOCKED")) return;

            navigator.clipboard.writeText(keyText).then(() => {
                const btn = document.getElementById('copyBtn');
                if (!btn) return;
                btn.innerText = "COPIED SUCCESSFULLY! ✅";
                btn.style.background = "#00ff88";
                setTimeout(() => { 
                    btn.innerText = "COPY TO CLIPBOARD"; 
                    btn.style.background = "#ffffff";
                }, 2000);
            });
        };

        // --- INITIALIZE ---
        renderContent(isValidSource);

        // If it's a valid source, ensure key generation runs after DOM is fully ready
        if (isValidSource) {
            // generateLockedKey is called inside renderContent
            // but we also ensure it runs if called again
            if (document.readyState === 'complete') {
                generateLockedKey();
            } else {
                window.addEventListener('load', generateLockedKey);
            }
        }

    })();
</script>
</body>
</html>
